# el34 Ollama overlay — aisec 코스 의 LLM 호출용 (gemma3:4b default).
# CPU inference (slow, 첫 응답 30-60s). GPU 가 있으면 --gpus all 옵션.
# SKIP_OLLAMA=1 bash el34.sh up 로 비활성.

services:
  ollama:
    container_name: el34-ollama
    image: ollama/ollama:latest
    hostname: ollama
    networks:
      ext:
        ipv4_address: 10.20.30.220
    ports:
      - "${PORT_OLLAMA:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      # 시각: KST(Asia/Seoul) 통일 — zoneinfo 실파일 마운트(호스트 TZ 무관 고정).
      - "/usr/share/zoneinfo/Asia/Seoul:/etc/localtime:ro"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      TZ: "Asia/Seoul"
    restart: unless-stopped

volumes:
  ollama-data:
