# el34 vhost — bastion.el34.lab → bastion:9100 (관리 도구 — ModSecurity 통과)
#
# 백엔드는 **IP(10.20.30.201) 로 지정**한다. bastion 은 ext 망 전용이고 web 은 dmz/int 에만
# 붙어 있어, compose DNS 별칭 'bastion' 이 web 에서는 해석되지 않는다
# (bastion_error.log: "AH00898: DNS lookup failure for: bastion" → 카드가 502).
# 실제 경로(web→ips→fw→ext bastion)는 IP 로 지정하면 정상 동작한다.
<VirtualHost *:80>
    ServerName bastion.el34.lab

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://10.20.30.201:9100/
    ProxyPassReverse / http://10.20.30.201:9100/

    ErrorLog ${APACHE_LOG_DIR}/bastion_error.log
    CustomLog ${APACHE_LOG_DIR}/bastion_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName bastion.el34.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://10.20.30.201:9100/
    ProxyPassReverse / http://10.20.30.201:9100/

    ErrorLog ${APACHE_LOG_DIR}/bastion_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/bastion_tls_access.log combined
</VirtualHost>
