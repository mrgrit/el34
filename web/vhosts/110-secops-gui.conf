# el34 vhost — 보안장비 교육 콘솔 (secuops-easy GUI) 프론트 라우팅.
#
# 배경: 과거 HAProxy 엣지가 fw-gui/ips-gui/waf-gui.el34.lab → 각 컨테이너 :8080 을
#       라우팅했으나, HAProxy 제거(→ L3 DNAT + Apache vhost) 이행 시 앱 사이트(juice/dvwa/…)
#       는 재배선됐지만 이 3개 콘솔 라우트가 누락되어 .lab 접속이 랜딩으로 폴백됐다.
#       각 GUI 는 fw/ips/web 컨테이너 :8080 에서 이미 자동 기동 중(호스트 8081/8082/8083 로도 노출).
#
# 도달 경로:
#   waf-gui → web 자기 자신 127.0.0.1:8080
#   ips-gui → ips(dmz 10.20.32.1):8080   (web 과 dmz 공유 — 직접 도달)
#   fw-gui  → fw(pipe 10.20.31.1):8080    (web→ips(gw)→pipe 라우팅, fw nft policy accept)
#
# SecRuleEngine Off: 이 콘솔들은 nft/SecRule/Suricata 룰 문법을 POST 로 제출한다.
#   전역 SecRuleEngine On(CRS) 이면 룰 본문이 인젝션으로 오탐·차단되므로 관리도구는 예외.

# ─── fw-gui.el34.lab → 방화벽 콘솔 (fw:8080) ───────────────────────────────
<VirtualHost *:80>
    ServerName fw-gui.el34.lab
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.31.1:8080/
    ProxyPassReverse / http://10.20.31.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/fwgui_error.log
    CustomLog ${APACHE_LOG_DIR}/fwgui_access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName fw-gui.el34.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.31.1:8080/
    ProxyPassReverse / http://10.20.31.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/fwgui_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/fwgui_tls_access.log combined
</VirtualHost>

# ─── ips-gui.el34.lab → IPS 콘솔 (ips:8080) ────────────────────────────────
<VirtualHost *:80>
    ServerName ips-gui.el34.lab
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.32.1:8080/
    ProxyPassReverse / http://10.20.32.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/ipsgui_error.log
    CustomLog ${APACHE_LOG_DIR}/ipsgui_access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName ips-gui.el34.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://10.20.32.1:8080/
    ProxyPassReverse / http://10.20.32.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/ipsgui_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/ipsgui_tls_access.log combined
</VirtualHost>

# ─── waf-gui.el34.lab → WAF(ModSec) 콘솔 (web 자기 자신 :8080) ──────────────
<VirtualHost *:80>
    ServerName waf-gui.el34.lab
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/wafgui_error.log
    CustomLog ${APACHE_LOG_DIR}/wafgui_access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName waf-gui.el34.lab
    SSLEngine on
    SSLCertificateFile      /etc/apache2/ssl/server.crt
    SSLCertificateKeyFile   /etc/apache2/ssl/server.key
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    SecRuleEngine Off
    ErrorLog ${APACHE_LOG_DIR}/wafgui_tls_error.log
    CustomLog ${APACHE_LOG_DIR}/wafgui_tls_access.log combined
</VirtualHost>
